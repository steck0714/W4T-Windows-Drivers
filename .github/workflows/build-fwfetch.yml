# fwfetch: the Rust tool that reads firmware you may not redistribute from YOUR OWN SD card (read-only).
#   test     (ubuntu)   clippy with -D warnings, the synthetic-image tests (incl. 210 corrupted-input runs), the proprietary-file guard.
#   windows  (windows)  fwfetch.exe for x86_64 and ARM64 Windows (a Switch running Windows ARM64 can run the arm64 one).
#   arm64-run (windows-11-arm) runs the ARM64 fwfetch.exe for real: file-based scan of a synthetic SD image (random data, no NVIDIA
#              files) + --deploy-gpu with SHA-256 checks, then a read-only physical-disk smoke test (informational).
#   release  (every push / manual run, not pull requests)  publishes the built .exe files + SHA256SUMS as a GitHub pre-release:
#              - tag fwfetch-v* pushed, or manual run with release_tag=fwfetch-vX.Y.Z -> that versioned pre-release
#              - any other push to a branch (main/master/test) or manual run without release_tag -> a rolling pre-release
#                "fwfetch-nightly-<branch>" that is replaced by every successful run (always the latest build of that branch).
#              Runs as soon as test + windows (the .exe builds) passed; it does NOT wait for the ARM64 run to succeed, so a
#              failing/slow ARM64 runner can no longer block the .exe. The ARM64 run result is written into the release notes.
# UNTESTED on GitHub when written; the code was tested on Linux only. The Windows-specific part is raw-disk opening
# (\\.\PhysicalDriveN), which no test here exercised.
name: build-fwfetch
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional. A tag like fwfetch-v1.0.0 to publish a versioned pre-release. Leave empty to refresh the rolling fwfetch-nightly-<branch> release'
        required: false
        default: ''
        type: string
  push:
    branches: [main, master, test]
    tags: ['fwfetch-v*']
    paths: ['tools/fwfetch/**', '.github/workflows/build-fwfetch.yml']
  pull_request:
    paths: ['tools/fwfetch/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: cargo clippy --locked --release --manifest-path tools/fwfetch/Cargo.toml -- -D warnings
      - run: python3 tools/fwfetch/tests/run_tests.py
      - run: python3 tools/check_no_proprietary.py
      - name: Dump the synthetic SD image for the ARM64 run test
        run: FWFETCH_DUMP_FIXTURE="$RUNNER_TEMP/fixture" python3 tools/fwfetch/tests/run_tests.py
      - uses: actions/upload-artifact@v4
        with:
          name: fwfetch-fixture
          path: ${{ runner.temp }}/fixture
          retention-days: 3

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --manifest-path tools/fwfetch/Cargo.toml --target ${{ matrix.target }}
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "tools/fwfetch/target/${{ matrix.target }}/release/fwfetch.exe" "dist/fwfetch-${{ matrix.target }}.exe"
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS-${{ matrix.target }}.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fwfetch-${{ matrix.target }}
          path: dist

  arm64-run:
    needs: [test, windows]
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fwfetch-aarch64-pc-windows-msvc
          path: ${{ runner.temp }}\bin
      - uses: actions/download-artifact@v4
        with:
          name: fwfetch-fixture
          path: ${{ runner.temp }}\fx
      - name: The exe is ARM64 and starts
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'bin\fwfetch-aarch64-pc-windows-msvc.exe'
          $b = [IO.File]::ReadAllBytes($exe)
          $machine = '{0:X4}' -f [BitConverter]::ToUInt16($b, [BitConverter]::ToInt32($b, 0x3C) + 4)
          Write-Host "PE machine 0x$machine (AA64 = ARM64); runner PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          if ($machine -ne 'AA64') { throw "not an ARM64 binary (0x$machine)" }
          & $exe --help 2>&1 | Out-String | Write-Host
      - name: Scan the synthetic SD image and deploy the GPU files (SHA-256 checked)
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'bin\fwfetch-aarch64-pc-windows-msvc.exe'
          $fx = Join-Path $env:RUNNER_TEMP 'fx'; $out = Join-Path $env:RUNNER_TEMP 'out'; $gpu = Join-Path $env:RUNNER_TEMP 'gpu'
          $log = & $exe --manifest "$fx\manifest.json" --profile lite --search-root "$fx\sd" --disk "$fx\disk-gpt.img" --out-dir $out --deploy-gpu $gpu 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -ne 0) { throw "fwfetch exit code $code (expected 0)" }
          $exp = Get-Content "$fx\expected.json" -Raw | ConvertFrom-Json
          $bad = 0
          foreach ($p in $exp.gpu.PSObject.Properties) {
            $f = Join-Path $gpu $p.Name
            $h = if (Test-Path $f) { (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() } else { 'missing' }
            Write-Host ('{0,-5} {1}' -f $(if ($h -eq $p.Value) { 'ok' } else { 'DIFF' }), $p.Name)
            if ($h -ne $p.Value) { $bad++ }
          }
          if ($bad) { throw "$bad of 9 deployed GPU files differ" }
      - name: Physical-disk smoke test (read-only, informational)
        shell: pwsh
        continue-on-error: true
        run: |
          # The runner is a VM: nothing to find. This only checks that opening \\.\PhysicalDriveN and scanning does not crash.
          $exe = Join-Path $env:RUNNER_TEMP 'bin\fwfetch-aarch64-pc-windows-msvc.exe'
          $log = & $exe --profile erista --auto --out-dir (Join-Path $env:RUNNER_TEMP 'auto') 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $log; Write-Host "exit code: $code (0 = all found, 2 = some missing, 1 = error)"
          if ($log -match 'panicked' -or @(0,1,2) -notcontains $code) { throw 'fwfetch crashed' }
          exit 0  # informational step: do not let fwfetch's exit code 2 (nothing found on a VM) become the step result

  release:
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.windows.result == 'success' }}
    needs: [windows, arm64-run]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: fwfetch-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_TYPE: ${{ github.ref_type }}
          ARM64_RESULT: ${{ needs.arm64-run.result }}
        run: |
          set -e
          ls -l dl
          ls dl/fwfetch-*.exe >/dev/null 2>&1 || { echo 'no fwfetch-*.exe was downloaded from the build artifacts' >&2; exit 1; }
          cat dl/SHA256SUMS-*.txt > dl/SHA256SUMS.txt
          SHORT="${GITHUB_SHA:0:7}"
          NOTES="fwfetch: reads firmware from your own SD card, read-only. Contains no firmware. See tools/fwfetch/README-ja.md. Built from commit $GITHUB_SHA. ARM64 run test: $ARM64_RESULT."
          if [ "$REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$INPUT_TAG"; fi
          if [ -n "$TAG" ]; then
            # versioned release: create it, or replace the files of an existing one
            case "$TAG" in fwfetch-v*) ;; *) echo "bad tag: $TAG (must start with fwfetch-v)" >&2; exit 1 ;; esac
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dl/fwfetch-*.exe dl/SHA256SUMS.txt
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
                --title "$TAG (not verified on a real console)" --notes "$NOTES" \
                dl/fwfetch-*.exe dl/SHA256SUMS.txt
            fi
          else
            # rolling release of this branch: drop the old one (and its tag) and publish the new build
            BRANCH="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
            TAG="fwfetch-nightly-$BRANCH"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "fwfetch nightly ($GITHUB_REF_NAME, $SHORT) - not verified on a real console" --notes "$NOTES" \
              dl/fwfetch-*.exe dl/SHA256SUMS.txt
          fi
          echo "published $TAG" >> "$GITHUB_STEP_SUMMARY"
