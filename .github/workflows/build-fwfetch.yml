# fwfetch: the Rust tool that reads firmware you may not redistribute from YOUR OWN SD card (read-only).
#   test     (ubuntu)   clippy with -D warnings, the synthetic-image tests (incl. 210 corrupted-input runs), the proprietary-file guard.
#   windows  (windows)  fwfetch.exe for x86_64 and ARM64 Windows (a Switch running Windows ARM64 can run the arm64 one).
#   release  (tag fwfetch-v*)  attaches the .exe files and SHA256SUMS to a GitHub release.
# UNTESTED on GitHub when written; the code was tested on Linux only. The Windows-specific part is raw-disk opening
# (\\.\PhysicalDriveN), which no test here exercised.
name: build-fwfetch
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['fwfetch-v*']
    paths: ['tools/fwfetch/**', '.github/workflows/build-fwfetch.yml']
  pull_request:
    paths: ['tools/fwfetch/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - run: cargo clippy --locked --release --manifest-path tools/fwfetch/Cargo.toml -- -D warnings
      - run: python3 tools/fwfetch/tests/run_tests.py
      - run: python3 tools/check_no_proprietary.py

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --locked --release --manifest-path tools/fwfetch/Cargo.toml --target ${{ matrix.target }}
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "tools/fwfetch/target/${{ matrix.target }}/release/fwfetch.exe" "dist/fwfetch-${{ matrix.target }}.exe"
          Get-FileHash dist/*.exe -Algorithm SHA256 | ForEach-Object { '{0}  {1}' -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } | Set-Content dist/SHA256SUMS-${{ matrix.target }}.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: fwfetch-${{ matrix.target }}
          path: dist

  release:
    if: startsWith(github.ref, 'refs/tags/fwfetch-v')
    needs: windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cat dl/SHA256SUMS-*.txt > dl/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME (not verified on a real console)" \
            --notes "fwfetch: reads firmware from your own SD card, read-only. Contains no firmware. See tools/fwfetch/README-ja.md." \
            dl/fwfetch-*.exe dl/SHA256SUMS.txt
